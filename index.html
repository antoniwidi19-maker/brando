<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRANDO — Beyond the Ordinary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #03050a;
      --text: #e8f0ff;
      --accent: #5ad7ff;
      --muted: rgba(232, 240, 255, 0.8);
      --font-head: "Orbitron", "Arial Black", sans-serif;
      --font-body: "Exo 2", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Share Tech Mono", "Courier New", monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    body.no-gl {
      background: radial-gradient(ellipse at 70% 50%, #2a0f3d 0%, #0a0616 40%, #03050a 80%);
    }
    body.no-gl #bg { display: none; }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 70% 50%,
        rgba(3, 5, 10, 0.1) 0%,
        rgba(3, 5, 10, 0.55) 60%,
        rgba(3, 5, 10, 0.88) 100%
      );
    }

    .logo {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: var(--font-head);
      font-size: 14px;
      letter-spacing: 0.4em;
      font-weight: 700;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 5;
    }

    section {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    /* Sebelum JS jalan, elemen reveal disembunyikan. Kalau JS gagal, konten tetap tampil. */
    .js .rv { opacity: 0; }
    .js .w { opacity: 0; }

    .w {
      display: inline-block;
    }

    .label {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.22em;
      color: var(--accent);
      margin-bottom: 18px;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-head);
      font-weight: 900;
      line-height: 1.05;
      text-shadow: 0 0 40px rgba(90, 215, 255, 0.25), 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    h1 {
      font-size: clamp(26px, 7.4vw, 84px);
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .sub {
      margin-top: 22px;
      max-width: 520px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      font-weight: 300;
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.3em;
      color: var(--muted);
    }

    /* ===== Mission ===== */
    .section-mission {
      align-items: flex-start;
      text-align: left;
      max-width: 1000px;
      margin: 0 auto;
      padding: 120px 24px;
    }

    .section-mission h2 {
      font-size: clamp(24px, 5.6vw, 52px);
      margin-bottom: 28px;
    }

    .section-mission p {
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      font-weight: 300;
      margin-bottom: 18px;
    }

    .section-mission .lead {
      color: var(--text);
      font-size: 20px;
      font-weight: 400;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 40px;
    }

    .stat {
      border: 1px solid rgba(90, 215, 255, 0.3);
      background: rgba(3, 5, 10, 0.7);
      padding: 14px 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.18em;
      color: var(--accent);
    }

    /* ===== Values ===== */
    .section-values {
      align-items: flex-start;
      text-align: left;
      max-width: 1000px;
      margin: 0 auto;
      padding: 120px 24px;
    }

    .section-values h2 {
      font-size: clamp(24px, 5.6vw, 52px);
      margin-bottom: 36px;
    }

    .principles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .principle {
      border-top: 1px solid rgba(90, 215, 255, 0.4);
      padding: 22px 4px 0;
    }

    .principle .idx {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .principle h4 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .principle p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 300;
    }

    /* ===== Worlds ===== */
    .section-worlds {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 24px;
      align-items: flex-start;
      text-align: left;
    }

    .section-worlds h2 {
      font-size: clamp(24px, 5.6vw, 52px);
      margin-bottom: 20px;
    }

    .worlds-intro {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      font-weight: 300;
      max-width: 620px;
      margin-bottom: 48px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .card {
      border: 1px solid rgba(90, 215, 255, 0.25);
      background: rgba(6, 12, 24, 0.8);
      padding: 32px 28px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.4s ease, transform 0.4s ease;
    }

    .card:hover {
      border-color: rgba(90, 215, 255, 0.6);
      transform: translateY(-4px);
    }

    .card .num {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 36px;
    }

    .card h3 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    .card p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 28px;
    }

    .card a {
      margin-top: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-decoration: none;
    }

    /* ===== Technology ===== */
    .section-tech {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 24px;
      align-items: flex-start;
      text-align: left;
    }

    .section-tech h2 {
      font-size: clamp(24px, 5.6vw, 52px);
      margin-bottom: 20px;
    }

    .tech-intro {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      font-weight: 300;
      max-width: 620px;
      margin-bottom: 48px;
    }

    .tech-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .tech-item {
      border-top: 1px solid rgba(90, 215, 255, 0.3);
      padding-top: 20px;
    }

    .tech-item .idx {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .tech-item h4 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .tech-item p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      font-weight: 300;
    }

    /* ===== About ===== */
    .section-about {
      max-width: 800px;
      margin: 0 auto;
      padding: 120px 24px;
      align-items: flex-start;
      text-align: left;
    }

    .section-about h2 {
      font-size: clamp(24px, 5.6vw, 52px);
      margin-bottom: 28px;
    }

    .section-about p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      font-weight: 300;
      margin-bottom: 18px;
    }

    .coords {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 20px;
    }

    /* ===== FAQ ===== */
    .section-faq {
      align-items: flex-start;
      text-align: left;
      max-width: 800px;
      margin: 0 auto;
      padding: 120px 24px;
    }

    .section-faq h2 {
      font-size: clamp(24px, 5.6vw, 48px);
      margin-bottom: 36px;
    }

    .faq-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .faq-item {
      border-left: 2px solid rgba(90, 215, 255, 0.5);
      padding: 4px 0 4px 20px;
    }
