    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #03050a;
      --text: #e8f0ff;
      --accent: #5ad7ff;
      --muted: rgba(232, 240, 255, 0.8);
      --head: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --body: "Helvetica Neue", Arial, sans-serif;
      --mono: "Courier New", Courier, monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      overflow-x: hidden;
    }

    /* ===== Latar lubang hitam (CSS) ===== */
    #space {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 70% 50%, #0b0d1c 0%, #03050a 65%);
    }

    .bh {
      position: absolute;
      left: 72%;
      top: 50%;
      width: min(60vmin, 520px);
      height: min(60vmin, 520px);
      transform: translate(-50%, -50%);
    }

    .bh-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 30%;
      height: 30%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #000;
      box-shadow: 0 0 36px 6px rgba(255, 70, 210, 0.35);
    }

      box-shadow: 0 0 16px rgba(255, 80, 220, 0.7);
    }
