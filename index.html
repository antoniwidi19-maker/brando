<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRANDO — Beyond the Ordinary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #03050a;
      --text: #e8f0ff;
      --accent: #5ad7ff;
      --muted: rgba(232, 240, 255, 0.55);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Canvas 3D tetap di belakang */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* Logo kecil di atas tengah */
    .logo {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 14px;
      letter-spacing: 0.4em;
      font-weight: 600;
    }

    /* Konten scroll */
    main {
      position: relative;
      z-index: 5;
    }

    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    .label {
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(90, 215, 255, 0.25);
    }

    .sub {
      margin-top: 22px;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      font-family: "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <canvas id="scene"></canvas>

  <div class="logo">BRANDO.</div>

  <main>
    <section id="hero">
      <div class="label">// INDEPENDENT DIGITAL UNIVERSE</div>
      <h1>BEYOND<br>THE ORDINARY.</h1>
      <p class="sub">
        A new perspective on creativity, technology and the universe.
        Enter a world where imagination has no boundaries.
      </p>
      <div class="scroll-hint">SCROLL TO DESCEND ↓</div>
    </section>

    <!-- Section lain nanti ditambah di langkah berikutnya -->
    <section style="min-height: 100vh;"></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ===== Renderer, scene, kamera =====
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x03050a, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x03050a, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9);

    // ===== Lighting =====
    scene.add(new THREE.AmbientLight(0x404a66, 0.6));
    const sun = new THREE.DirectionalLight(0xbfe6ff, 1.2);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    // ===== Bumi =====
    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 64, 64),
      new THREE.MeshPhongMaterial({
        color: 0x1a4a8a,
        emissive: 0x06142e,
        shininess: 25
      })
    );
    earthGroup.add(earth);

    // Atmosfer (glow biru di luar bumi)
    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(2.35, 64, 64),
      new THREE.MeshBasicMaterial({
        color: 0x5ad7ff,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending
      })
    );
    earthGroup.add(atmosphere);

    // Bumi sedikit miring
    earthGroup.rotation.z = THREE.MathUtils.degToRad(-18);
    earthGroup.position.set(0, -2.6, 0);

    // ===== Satelit =====
    const satellite = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.6),
      new THREE.MeshPhongMaterial({ color: 0xd8dde8, shininess: 80 })
    );
    satellite.add(body);

    const panelMat = new THREE.MeshPhongMaterial({
      color: 0x1b2a5c,
      emissive: 0x081028,
      shininess: 120
    });
    const panelL = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 0.6), panelMat);
    panelL.position.x = -0.9;
    const panelR = panelL.clone();
    panelR.position.x = 0.9;
    satellite.add(panelL, panelR);

    satellite.position.set(1.6, 1.4, 1.2);
    scene.add(satellite);

    // ===== Bintang =====
    const starCount = 1500;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPos[i * 3]     = (Math.random() - 0.5) * 120;
      starPos[i * 3 + 1] = (Math.random() - 0.5) * 120;
      starPos[i * 3 + 2] = (Math.random() - 0.5) * 120;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.8 })
    );
    scene.add(stars);

    // ===== Scroll progress =====
    let scrollProgress = 0;

    function updateScroll() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      scrollProgress = max > 0 ? window.scrollY / max : 0;
    }
    window.addEventListener('scroll', updateScroll, { passive: true });

    // ===== Resize =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== Loop animasi =====
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Bumi berputar pelan
      earth.rotation.y = t * 0.05;

      // Satelit mengorbit bumi
      const angle = t * 0.25;
      satellite.position.set(
        Math.cos(angle) * 3.2,
        1.2 + Math.sin(angle * 0.5) * 0.3,
        Math.sin(angle) * 3.2 - 1
      );
      satellite.lookAt(earthGroup.position);

      // Kamera turun pelan sesuai scroll
      camera.position.y = -scrollProgress * 3;
      camera.position.z = 9 - scrollProgress * 2;
      camera.lookAt(0, camera.position.y * 0.5, 0);

      // Bintang berputar pelan
      stars.rotation.y = t * 0.01;

      renderer.render(scene, camera);
    }

    updateScroll();
    animate();
  </script>
</body>
</html>
