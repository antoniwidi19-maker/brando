<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRANDO — Beyond the Ordinary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #03050a;
      --text: #e8f0ff;
      --accent: #5ad7ff;
      --muted: rgba(232, 240, 255, 0.55);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Canvas 3D tetap di belakang */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* Logo kecil di atas tengah */
    .logo {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 14px;
      letter-spacing: 0.4em;
      font-weight: 600;
    }

    /* Konten scroll */
    main {
      position: relative;
      z-index: 5;
    }

    section {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    .label {
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(90, 215, 255, 0.25);
    }

    .sub {
      margin-top: 22px;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      font-family: "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--muted);
    }

    /* ===== Mission ===== */
    .section-mission {
      align-items: flex-start;
      text-align: left;
      max-width: 1000px;
      margin: 0 auto;
      padding: 120px 24px;
    }

    .section-mission h2 {
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 28px;
      text-shadow: 0 0 30px rgba(90, 215, 255, 0.2);
    }

    .section-mission p {
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .section-mission .lead {
      color: var(--text);
      font-size: 20px;
    }

      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 40px;
    }
