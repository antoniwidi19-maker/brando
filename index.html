  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #03050a;
      --text: #e8f0ff;
      --accent: #5ad7ff;
      --pink: #ff5fd8;
      --muted: rgba(232, 240, 255, 0.8);
      --font-head: "Orbitron", "Arial Black", "Trebuchet MS", sans-serif;
      --font-body: "Exo 2", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Share Tech Mono", "Courier New", monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    /* ===== LATAR ANGKASA (CSS, ringan) ===== */
    #space {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 70% 50%, #0b0d1c 0%, #03050a 65%);
    }

    .stars {
      position: absolute;
      inset: 0;
      background-repeat: repeat;
      animation: twinkle 4s ease-in-out infinite;
    }

    .stars.a {
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 90px 120px, #cfe9ff, transparent),
        radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent),
        radial-gradient(1px 1px at 230px 180px, #fff, transparent),
        radial-gradient(1px 1px at 300px 90px, #cfe9ff, transparent);
      background-size: 340px 240px;
    }

    .stars.b {
      background-image:
        radial-gradient(1px 1px at 50px 200px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 140px 20px, #cfe9ff, transparent),
        radial-gradient(1px 1px at 260px 150px, #fff, transparent),
        radial-gradient(1px 1px at 380px 230px, #fff, transparent);
      background-size: 420px 300px;
      animation-duration: 6s;
      animation-delay: -2s;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    /* Pusat lubang hitam: kanan di desktop, tengah-atas di HP */
    .bh {
      position: absolute;
      left: 72%;
      top: 50%;
      width: min(62vmin, 560px);
      height: min(62vmin, 560px);
      transform: translate(-50%, -50%);
    }

    @media (max-width: 700px) {
      .bh {
        left: 50%;
        top: 38%;
        width: 84vw;
        height: 84vw;
      }
    }

    .bh-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80%;
      height: 80%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 70, 210, 0.28) 0%, rgba(255, 70, 210, 0) 65%);
    }

    .bh-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28%;
      height: 28%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #000;
      box-shadow: 0 0 40px 8px rgba(255, 70, 210, 0.35);
    }

    .bh-photon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 31%;
      height: 31%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255, 170, 240, 0.95);
      box-shadow: 0 0 18px rgba(255, 80, 220, 0.75);
      animation: pulse 3.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.03); }
    }

    /* Piringan akresi: dibuat dengan conic-gradient + mask, lalu diputar */
    .disk-tilt {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%) perspective(700px) rotateX(70deg);
    }

    .disk {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      -webkit-mask: radial-gradient(circle, transparent 0 34%, #000 36% 46%, transparent 48%);
      mask: radial-gradient(circle, transparent 0 34%, #000 36% 46%, transparent 48%);
    }

    .disk.outer {
      background: conic-gradient(
        from 0deg,
        transparent 0deg 15deg,
        #ffe6fa 35deg,
        #ff4fd8 90deg,
        transparent 140deg 200deg,
        #ff4fd8 230deg,
        #7a86ff 290deg,
        transparent 330deg
      );
      animation: spin 16s linear infinite;
    }

    .disk.inner {
      inset: 14%;
      background: conic-gradient(
        from 60deg,
        transparent 0deg 20deg,
        #ffffff 60deg,
        #ff7ae6 110deg,
        transparent 170deg 240deg,
        #ff4fd8 280deg,
        transparent 320deg
      );
      animation: spin 9s linear infinite reverse;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Satelit kecil yang mengorbit */
    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%) perspective(900px) rotateX(70deg);
      animation: orbit 12s linear infinite;
    }

    @keyframes orbit {
      from { transform: translate(-50%, -50%) perspective(900px) rotateX(70deg) rotate(0deg); }
      to { transform: translate(-50%, -50%) perspective(900px) rotateX(70deg) rotate(360deg); }
    }
