<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRANDO — Beyond the Ordinary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #03050a;
      --text: #e8f0ff;
      --accent: #5ad7ff;
      --muted: rgba(232, 240, 255, 0.8);
      --head: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --body: "Helvetica Neue", Arial, sans-serif;
      --mono: "Courier New", Courier, monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      overflow-x: hidden;
    }

    /* ===== Latar lubang hitam (CSS saja) ===== */
    #space {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 70% 50%, #0b0d1c 0%, #03050a 65%);
    }

    .bh {
      position: absolute;
      left: 72%;
      top: 50%;
      width: min(60vmin, 520px);
      height: min(60vmin, 520px);
      transform: translate(-50%, -50%);
    }

    @media (max-width: 700px) {
      .bh { left: 50%; top: 36%; width: 80vw; height: 80vw; }
    }

    .bh-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 30%;
      height: 30%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #000;
      box-shadow: 0 0 36px 6px rgba(255, 70, 210, 0.35);
    }

    .bh-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36%;
      height: 36%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255, 170, 240, 0.9);
      box-shadow: 0 0 16px rgba(255, 80, 220, 0.7);
    }

    .disk {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 20deg,
        #ffe6fa 40deg,
        #ff4fd8 90deg,
        transparent 140deg 210deg,
        #7a86ff 260deg,
        transparent 310deg
      );
      -webkit-mask: radial-gradient(circle, transparent 0 36%, #000 40% 48%, transparent 50%);
      mask: radial-gradient(circle, transparent 0 36%, #000 40% 48%, transparent 50%);
      transform: perspective(700px) rotateX(70deg);
      animation: spin 18s linear infinite;
    }

    @keyframes spin {
      from { transform: perspective(700px) rotateX(70deg) rotate(0deg); }
      to   { transform: perspective(700px) rotateX(70deg) rotate(360deg); }
    }

      position: absolute;
      inset: 0;
      animation: twinkle 5s ease-in-out infinite;
    }
