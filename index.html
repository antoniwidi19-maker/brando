<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRANDO — Beyond the Ordinary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #03050a;
      --text: #e8f0ff;
      --accent: #5ad7ff;
      --muted: rgba(232, 240, 255, 0.78);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* Lapisan gelap tipis supaya teks tetap terbaca */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 70% 50%,
        rgba(3, 5, 10, 0.1) 0%,
        rgba(3, 5, 10, 0.55) 60%,
        rgba(3, 5, 10, 0.88) 100%
      );
    }

    .logo {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 14px;
      letter-spacing: 0.4em;
      font-weight: 600;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 5;
    }

    section {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    section > * {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }

    section.in > * {
      opacity: 1;
      transform: none;
    }

    section.in > *:nth-child(2) { transition-delay: 0.12s; }
    section.in > *:nth-child(3) { transition-delay: 0.24s; }
    section.in > *:nth-child(4) { transition-delay: 0.36s; }
    section.in > *:nth-child(5) { transition-delay: 0.48s; }

    .label {
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(90, 215, 255, 0.25), 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    .sub {
      margin-top: 22px;
      max-width: 520px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      font-family: "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--muted);
    }

    /* ===== Mission ===== */
    .section-mission {
      align-items: flex-start;
      text-align: left;
      max-width: 1000px;
      margin: 0 auto;
      padding: 120px 24px;
    }

    .section-mission h2 {
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 28px;
      text-shadow: 0 0 30px rgba(90, 215, 255, 0.2), 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    .section-mission p {
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .section-mission .lead {
      color: var(--text);
      font-size: 20px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 40px;
    }

    .stat {
      border: 1px solid rgba(90, 215, 255, 0.3);
      background: rgba(3, 5, 10, 0.7);
      padding: 14px 20px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--accent);
    }

    /* ===== Worlds ===== */
    .section-worlds {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 24px;
      align-items: flex-start;
      text-align: left;
    }

    .section-worlds h2 {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .worlds-intro {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      max-width: 620px;
      margin-bottom: 48px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .card {
      border: 1px solid rgba(90, 215, 255, 0.25);
      background: rgba(6, 12, 24, 0.8);
      padding: 32px 28px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s, transform 0.3s;
    }

    .card:hover {
      border-color: rgba(90, 215, 255, 0.6);
      transform: translateY(-4px);
    }

    .card .num {
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 36px;
    }

    .card h3 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .card p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .card a {
      margin-top: auto;
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-decoration: none;
    }

    /* ===== Technology ===== */
    .section-tech {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 24px;
      align-items: flex-start;
      text-align: left;
    }

    .section-tech h2 {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .tech-intro {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      max-width: 620px;
      margin-bottom: 48px;
    }

    .tech-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .tech-item {
      border-top: 1px solid rgba(90, 215, 255, 0.3);
      padding-top: 20px;
    }

    .tech-item .idx {
      font-family: "Courier New", monospace;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .tech-item h4 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .tech-item p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ===== About ===== */
    .section-about {
      max-width: 800px;
      margin: 0 auto;
      padding: 120px 24px;
      align-items: flex-start;
      text-align: left;
    }

    .section-about h2 {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 28px;
    }

    .section-about p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .coords {
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 20px;
    }

    /* ===== Contact ===== */
    .section-contact {
      padding: 120px 24px 80px;
    }

    .section-contact h2 {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .section-contact .sub {
      margin-bottom: 36px;
    }

    .btn {
      display: inline-block;
      border: 1px solid var(--accent);
      background: rgba(3, 5, 10, 0.7);
      color: var(--accent);
      padding: 16px 28px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }

    .btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .signal {
      margin-top: 36px;
      font-family: "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--muted);
    }

    /* ===== Footer ===== */
    footer {
      position: relative;
      z-index: 5;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      font-family: "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--muted);
      border-top: 1px solid rgba(90, 215, 255, 0.15);
      background: rgba(3, 5, 10, 0.85);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ===== Mobile ===== */
    @media (max-width: 600px) {
      .logo { font-size: 12px; }
      .section-mission,
      .section-worlds,
      .section-tech,
      .section-about,
      .section-contact { padding: 90
